# ============================================================================
# Windows WDK + MSVC 驱动云编译工具链 (GitHub Actions)
# ----------------------------------------------------------------------------
# 产物:
#   - UNPPLControl.exe  用户态控制程序(普通 C, 直接 cl.exe 编译, 不依赖 WDK)
#   - unppl.sys         内核驱动(WDK WindowsKernelModeDriver10.0 toolset)
# ----------------------------------------------------------------------------
# 使用方法:
#   1. 把 .github/ 与 unppl.vcxproj 复制到你仓库根目录
#   2. 保持 UNPPLControl.c 与 unppl.c 位于仓库根目录
#   3. push 或手动触发 Actions, 即可从 Actions 页下载 artifacts
# ============================================================================

name: WDK Driver Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:            # 支持在 Actions 页面手动触发

env:
  CONFIGURATION: Release
  PLATFORM: x64
  # WDK 版本:
  #   runner 预装 WDK 22H2 (10.0.22621), 但 SDK 是 10.0.26100 —— 版本不匹配时
  #   MSBuild 会报 "WDK corresponding to target version ... was not found"。
  #   解决: msbuild 命令行显式传递 /p:WindowsTargetPlatformVersion=10.0.22621.0
  #   使 SDK 与 WDK 版本对齐 (预装 22H2 同时有匹配的 SDK 22621)。
  #   若需要特定新版 WDK, 设置下面的 WDK_VERSION 并通过 winget 安装。
  WDK_VERSION: ""
  WDK_TARGET_VERSION: "10.0.22621.0"
  # 是否用自签测试证书给 unppl.sys 打测试签名(便于本机 testsigning 加载测试)
  SIGN_TEST_CERT: "true"

jobs:
  build:
    name: Build UNPPLControl.exe + unppl.sys
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # ---- 安装指定版本的 WDK -----------------------------------------------
      # winget 只在 cmd 的 PATH 中, pwsh 不能直接调, 必须通过 cmd /c 桥接。
      # 不依赖 winget 退出码判断成败 (already-installed 等码在不同 shell 下
      # 表现不一致); 安装完后直接用 km\wdm.h 硬验证 WDK 是否真的可用。
      - name: Install WDK ${{ env.WDK_VERSION }}
        if: env.WDK_VERSION != ''
        shell: pwsh
        run: |
          $wdkId = "Microsoft.WindowsWDK.$env:WDK_VERSION"
          Write-Host "Installing WDK $env:WDK_VERSION via winget..."
          cmd /c "winget install --source winget --exact --id $wdkId --accept-package-agreements --accept-source-agreements --silent --disable-interactivity 2>&1"
          Write-Host "winget exit: $LASTEXITCODE (0=success, other codes may indicate already-installed or errors)"
          $kmWdm = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$env:WDK_VERSION.0\km\wdm.h"
          if (-not (Test-Path $kmWdm)) {
            Write-Error "WDK $env:WDK_VERSION install failed or incomplete: $kmWdm not found."
            Write-Host "Installed Include dirs:"
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue | Select-Object Name
            exit 1
          }
          Write-Host "WDK $env:WDK_VERSION verified (wdm.h found)."

      # ---- 用户态控制程序: 普通 C 直接 cl.exe 编译 --------------------------
      # 不引入 vcxproj/WDK, 就是最朴素的 MSVC 编译。如需链接额外库,
      # 在 /link 后追加, 例如: ... /link ws2_32.lib /DEBUG
      # 注意: 不要用 cmd 的 for/vswhere 去设置 MSVC 环境——GitHub Actions 的
      # cmd shell 会把脚本写成 .cmd 批处理文件, 循环变量必须写 %%i, 且引号
      # 嵌套极易解析失败。这里用社区标准做法 ilammy/msvc-dev-cmd 注入环境。
      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build UNPPLControl.exe (user-mode, plain C)
        shell: cmd
        run: |
          cl.exe /nologo /O2 /W3 /Zi /Fe:UNPPLControl.exe UNPPLControl.c /link /DEBUG
          if errorlevel 1 exit /b 1
          dir UNPPLControl.exe

      # ---- 内核驱动: WDK 编译为 .sys ---------------------------------------
      # 使用 WDK NuGet 包 (Microsoft.Windows.WDK.x64) 提供内核头文件和库,
      # 版本 10.0.26100.1882 匹配 runner 的 SDK 10.0.26100。
      # Directory.Build.props 自动导入 WDK 构建支持, 无需 /p:WindowsTargetPlatformVersion。
      - name: Restore WDK NuGet package
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages
          Write-Host "=== NuGet package tree (depth 4) ==="
          Get-ChildItem "packages\Microsoft.Windows.WDK.x64.*" -Recurse -Depth 4 -ErrorAction SilentlyContinue | ForEach-Object {
            $indent = "  " * ($_.FullName.Split([IO.Path]::DirectorySeparatorChar).Count - $PWD.Path.Split([IO.Path]::DirectorySeparatorChar).Count)
            if ($_.PSIsContainer) { Write-Host "${indent}[$($_.Name)]" } else { Write-Host "${indent}$($_.Name)" }
          }

      - name: Build unppl.sys (kernel-mode, WDK)
        run: |
          msbuild unppl.vcxproj /m /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }} /v:minimal

      # ---- 可选: 自签测试签名, 方便本机加载测试 -----------------------------
      # 失败不阻断构建(未签名驱动在 testsigning 模式下同样可加载)。
      - name: Sign unppl.sys with self-signed test cert
        if: env.SIGN_TEST_CERT == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $sys = "x64\$env:CONFIGURATION\unppl.sys"
          if (-not (Test-Path $sys)) { Write-Error "unppl.sys not found"; exit 1 }
          $thumb = (New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=WorkBuddy CI Test Cert" -CertStoreLocation Cert:\CurrentUser\My).Thumbprint
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          & $signtool.FullName sign /v /fd SHA256 /s My /sha1 $thumb /t http://timestamp.digicert.com $sys
          Write-Host "Signed: $sys"

      # ---- 收集产物 ---------------------------------------------------------
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          Copy-Item UNPPLControl.exe artifacts\ -ErrorAction SilentlyContinue
          Copy-Item UNPPLControl.pdb artifacts\ -ErrorAction SilentlyContinue
          Copy-Item "x64\$env:CONFIGURATION\unppl.sys" artifacts\ -ErrorAction SilentlyContinue
          Copy-Item "x64\$env:CONFIGURATION\unppl.pdb" artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: driver-binaries
          path: artifacts/
          if-no-files-found: error
