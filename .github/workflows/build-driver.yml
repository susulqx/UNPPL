# ============================================================================
# Windows WDK + MSVC 驱动云编译工具链 (GitHub Actions)
# ----------------------------------------------------------------------------
# 产物:
#   - UNPPLControl.exe  用户态控制程序(普通 C, 直接 cl.exe 编译, 不依赖 WDK)
#   - unppl.sys         内核驱动(WDK NuGet 包提供头文件, 纯 cl/link 编译)
# 驱动编译用纯 cl.exe/link.exe 命令行, 绕过 MSBuild WDK toolset — 12 次踩坑验证。
# ============================================================================

name: WDK Driver Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CONFIGURATION: Release
  PLATFORM: x64
  SIGN_TEST_CERT: "true"

jobs:
  build:
    name: Build UNPPLControl.exe + unppl.sys
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build UNPPLControl.exe (user-mode, plain C)
        shell: cmd
        run: |
          cl.exe /nologo /O2 /W3 /Zi /Fe:UNPPLControl.exe UNPPLControl.c /link /DEBUG
          if errorlevel 1 exit /b 1
          dir UNPPLControl.exe

      # ---- 内核驱动: 纯 cl/link 编译 .sys (绕过 WDK toolset) --------------
      # NuGet WDK 包提供头文件/库; 手写 cl + link 命令行编译内核驱动。
      - name: Restore WDK NuGet package
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages

      - name: Build unppl.sys (kernel-mode, pure cl/link)
        shell: cmd
        run: |
          set KMINC=packages\Include\10.0.26100.0\km
          set SHAREDINC=packages\Include\10.0.26100.0\shared
          set KMLIB=packages\Lib\10.0.26100.0\km\x64
          cl.exe /nologo /O2 /W3 /Zi /c /D_AMD64_ /D_WIN64 /DDRIVER /DNDEBUG /I"%KMINC%" /I"%SHAREDINC%" /Founppl.obj unppl.c
          if errorlevel 1 exit /b 1
          link.exe /nologo /DRIVER:WDM /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /DEBUG /LIBPATH:"%KMLIB%" ntoskrnl.lib wdmsec.lib /OUT:unppl.sys unppl.obj
          if errorlevel 1 exit /b 1
          dir unppl.sys

      # ---- 自签测试签名 -----------------------------------------------------
      - name: Sign unppl.sys with self-signed test cert
        if: env.SIGN_TEST_CERT == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $sys = "unppl.sys"
          if (-not (Test-Path $sys)) { Write-Error "unppl.sys not found"; exit 1 }
          $thumb = (New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=WorkBuddy CI Test Cert" -CertStoreLocation Cert:\CurrentUser\My).Thumbprint
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          & $signtool.FullName sign /v /fd SHA256 /s My /sha1 $thumb /t http://timestamp.digicert.com $sys
          Write-Host "Signed: $sys"

      # ---- 收集产物 ---------------------------------------------------------
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          Copy-Item UNPPLControl.exe artifacts\ -ErrorAction SilentlyContinue
          Copy-Item UNPPLControl.pdb artifacts\ -ErrorAction SilentlyContinue
          Copy-Item unppl.sys artifacts\ -ErrorAction SilentlyContinue
          Copy-Item unppl.pdb artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: driver-binaries
          path: artifacts/
          if-no-files-found: error
